defaults:
  - _self_

data:
  data_path: "/scr/shared/datasets/robot_pref/stack_mixed/stack_mixed.pt"
  segment_length: 32
  use_relative_eef: false
  overwrite: true
  num_segments: 2500
  val_split: 0.1 # percentage of data to hold out for eval

image_embedding:
  enabled: false
  model_name: "resnet50"  # Options: resnet50, r3m, radio-g, radio-h, radio-l, radio-b, e-radio
  device: "cuda"
  feature_fmt: "NCHW"
  use_spatial_features: false
  batch_size: 32

dtw:
  enabled: true
  use_relative_eef: false

seed: 42